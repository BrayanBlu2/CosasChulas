<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="container">
        <button>
            Scorpión
        </button>
        <img src="ScorpionPro.png" alt="ScorpionPro">
    </div>

    <div id="container2">
        <h1>
            Scorpión
        </h1>
    </div>

    <div id="container3">
    </div>

    <audio id="audio">         
        <source src="KunayA.mp3" type="audio/mpeg">        
    </audio>

    <audio id="kunayA">         
        <source src="getOverHere.mp3" type="audio/mpeg">        
    </audio>

    <div id="container4">
    </div>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #container {
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            width: 100px;
            height: 100px;
            background-image: url(ScorpionPro.png);
            background-position: center;
            background-size: cover;
            color: rgb(255, 255, 255);
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            position: relative;
            z-index: 1;
            border-radius: 20px;
            background-color: #0c0c0c;  
        }

        img{
            position: absolute;
            width: auto;
            height: 250px;
            margin-bottom: 100px;
            opacity: 0;
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }    

        button:hover{
            background-image: url(Scorpion.jpg);
            background-position: center;
            background-size: cover;
            animation: arpon 1s ease 1 forwards;
            background-color: #000000;
            color: rgb(252, 94, 2);
            display: flex;
            justify-content: center;
            transition: 0.5s ease;
            text-shadow:  0px 0px 10px rgb(252, 94, 2), 
                            0px 0px 20px rgb(252, 94, 2), 
                            0px 0px 30px rgb(252, 94, 2);  
            border: 1px solid rgb(177, 177, 177);                      
        }


        button:hover ~ img{
            opacity: 1;
            transition: 1s ease;
            transform: translateY(-30px);
            filter: drop-shadow(0px 0px 10px rgb(199, 77, 7));
        }

        #container2{
            width: 100%;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 0%;

            h1{
                font-size: 80px;
                background-image: url(fere1.gif);
                background-position: center;
                background-size: cover;
                color: transparent;
                background-clip: text;
                -webkit-background-clip: text;
                
            }
        }

        #container3{
            width: 498px;
            height: 322px;
            background-image: url(getOverHere.gif);
            /*background-attachment: fixed;*/
            background-size: cover;
            background-position: center;
            position: absolute;
            display: none;
            z-index: 10;
            margin-top: 0%;
            padding: 0%;
            animation: 1.8s ease 1 forwards;
        }

        #container4{
            width: 666px;
            height: 365px;
            background-image: url(Kunay.png);
            /*background-attachment: fixed;*/
            background-size: cover;
            background-position: center;
            position: absolute;
            z-index: 10;
            margin-top: 0%;
            padding: 0%;
            scale: 0;
            animation: 1.3s ease 1 forwards;
            margin-top: -50px;
        }

        @keyframes cambio {
            0% {
                transform: rotateX(56deg);
                scale: 0;
            }
            100% {
                transform: rotateX(56deg);
                scale: 1.4;
            }
        }


        @keyframes arpon {
            0% {
                background-position: 100px -60px;
                background-repeat: no-repeat;
    
            }
            100% {
                background-position: 0px -10px;
                background-repeat: no-repeat;
                -webkit-box-reflect: below 3px linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.4));
            }
        }

        @keyframes getOverHere {
            0% {
                opacity: 1;
                visibility: visible;
            }
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }


    </style>

<script>
    // Escucha el evento de scroll para aplicar el efecto de agrandado
    window.addEventListener('scroll', () => {
        const img = document.querySelector('#container3');
        console.log(img.offsetTop);
        console.log(window.scrollY); 
        if (window.scrollY > (img.offsetTop)) {
            document.getElementById("container3").style.display = "flex";  
            document.getElementById("kunayA").play();
            //document.getElementById("audio").play();
            setTimeout(() => {
                document.getElementById("container3").style.display = "none";
            }, 1800);

        } else {
            document.getElementById("container3").style.animationName = "none";
        }
    });

    //Animación del sonido del arpón
    document.querySelector('button').addEventListener('click', () => {
        document.getElementById("audio").play();
        document.getElementById("container4").style.animationName = "cambio";
        setTimeout(() => {
            document.getElementById("container4").style.animationName = "none";
        }, 1300);
    });

    //Animación de la pantalla de la imagen del arpón
</script>

</body>
</html>
